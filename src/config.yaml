site:
  name: "Marc-Aurel Wilzin"
  site: "https://mwilzin.de/"
  base: "/"
  # Match /about and /about/ — bad URLs always hit the custom 404
  trailingSlash: ignore
  defaultLanguage: "de"


# Default SEO metadata
metadata:
  title:
    default: Marc-Aurel Wilzin — Mobile · Flutter · Apps
    template: '%s — Marc-Aurel Wilzin'
  description: 'Informatik-Student und App-Entwickler. Flutter, Swift & Backend — von Kapitel über scannerbox. bis TVL Tennis.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Marc-Aurel Wilzin
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: de
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
